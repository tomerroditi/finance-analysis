[tool.poetry]
name = "finance-analysis"
version = "1.91.0"
description = ""
authors = ["Author Name <tomerroditi1@gmail.com>"]
readme = "README.md"
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "==3.0.5"
numpy = "==2.5.2"
PyYAML = "==6.0.3"
SQLAlchemy = "==2.0.52"
keyring = ">=24.0.0"
# At-rest encryption of credential fields (backend/utils/crypto.py). Already
# a transitive dep of keyring on Linux; pinned explicitly so Windows/macOS
# installs get it too.
cryptography = ">=42.0"
# Backend API dependencies
fastapi = ">=0.109.0"
uvicorn = { version = ">=0.27.0", extras = ["standard"] }
python-dotenv = "^1.0.0"
alembic = "^1.14.0"
# Scraper dependencies
playwright = "^1.57.0"
httpx = "^0.28.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
Faker = "==40.37.0"
commitizen = "^4.4.1"
playwright = "^1.57.0"
requests = "^2.32.5"
ruff = ">=0.9,<0.17"
pytest-cov = "^7.0.0"
pytest-xdist = "^3.8.0"
# Schemathesis fuzzes the FastAPI OpenAPI schema at /openapi.json — runs in
# a dedicated CI job (see ci.yml), not via pytest, so it is not added to the
# `pythonpath` test discovery.
schemathesis = "^4.24.3"
# Provides a PlaintextKeyring fallback so the demo-mode toggle works in
# CI / sandbox environments without an OS keyring backend (Secret Service,
# Mac Keychain, Windows Credential Manager). Required for the empty-DB
# e2e gate; see frontend/e2e/onboarding-flows.spec.ts demo path.
"keyrings.alt" = "^5.0.2"

# Build-only deps for producing the self-contained desktop bundle.
# Kept out of the regular `poetry install` so dev installs stay slim;
# the release workflow installs it with `--only main,build`.
# `playwright` itself is already in the main deps (it's a runtime dep
# of the scraper); only `pyinstaller` is unique to building.
[tool.poetry.group.build]
optional = true

[tool.poetry.group.build.dependencies]
pyinstaller = "^6.10.0"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = ["sensitive: marks tests that pulls sensitive data from the internet"]
# `-n auto --dist loadgroup`: pytest-xdist runs one worker per core; a module
# that shares an expensive fixture pins itself to one worker with
# `pytest.mark.xdist_group`. Pass `-n0` to debug serially (pdb, print).
addopts = "--cov=backend --cov-report=term-missing -n auto --dist loadgroup"

[tool.coverage.run]
# sys.monitoring (PEP 669) instead of the default settrace tracer: same line
# data, about half the suite's runtime. Requires Python 3.12+ and no branch
# coverage.
core = "sysmon"
source = ["backend"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "backend/scraper/*",
]

[tool.coverage.report]
fail_under = 40
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py312"
line-length = 88
# The backend is the linted surface: `poetry run ruff check` and the guard in
# tests/backend/unit/test_code_quality.py both run against it.
include = ["backend/**/*.py"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "UP", "B", "C4", "PIE", "SIM", "RUF", "RET", "PERF",
    "FURB", "LOG", "T20", "ERA",
    "ANN",  # every function parameter and return type is annotated
    "D",    # every public module, class, method and function has a docstring
]
ignore = [
    "E501",   # the formatter owns line length; long strings stay readable
    "B008",   # FastAPI's `Depends(...)` defaults are the framework idiom
    "ANN401", # `Any` is the honest type for JSON payloads and pandas cells
    "D105",   # magic methods are self-describing
    "D107",   # NumPy style documents constructor parameters on the class
    "RUF001", # Hebrew text and ₪ are legitimate in strings,
    "RUF002", # docstrings
    "RUF003", # and comments
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.isort]
known-first-party = ["backend", "scraper"]

[tool.ruff.lint.per-file-ignores]
"backend/alembic/versions/*.py" = ["D103", "D400", "D205", "D415"]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver2"
version_provider = "poetry"
version_files = [
    "pyproject.toml:tool.poetry.version",
    "frontend/package.json:\"version\"",
    # The lockfile carries the app version twice (top level and the root
    # `packages[""]` entry). Bumping package.json without it left the lockfile
    # frozen at 1.52.1, so every fresh `npm install` produced a spurious 2-line
    # diff. Both lines are rewritten here because commitizen substitutes the
    # *current* version string on every line matching the pattern — see
    # tests/backend/unit/test_version_files_consistency.py, which guards the
    # one hazard that comes with it: a dependency pinned at the same version
    # would be rewritten too.
    "frontend/package-lock.json:\"version\"",
    "build/installer_script.nsi:^!define APP_VERSION \".*\"$",
]
update_changelog_on_bump = true
bump_message = "bump: version $current_version → $new_version [skip ci]"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
